<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你敢寫進紀錄嗎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
/* Layout: a pixel-art clinic scene with a JRPG dialogue window drives the story; beside it, the paper progress note fills in row by row. Single night-time look by design. */
:root{
  color-scheme:dark;
  --bg:#13141D; --panel:#1C1F2E; --line:#33384F; --text:#ECE7DA; --muted:#9CA1B9;
  --win1:#22305E; --win2:#141E3E; --frame:#E8E2CF; --gold:#F2C14E; --hp:#5FD38D; --hpbg:#2A2F44;
  --good:#6CCB8F; --warn:#F0B451; --bad:#F27D6C; --seal:#D9483B;
  --paper:#F3F1EA; --ink:#24242A; --pmuted:#6B6A70; --prule:#D3CFC2; --psoft:#E7E4DA;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --pixel:"Press Start 2P",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,20,.82);display:grid;place-items:center;padding:16px}
.gatebox{width:min(420px,100%);background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--frame);border-radius:8px;padding:20px;display:grid;gap:12px}
.gatebox h2{margin:0;font-family:var(--serif);font-size:22px}
.gatebox p{margin:0;color:var(--muted);font-size:14px}
.gatebox label{font-size:14px;color:var(--text);display:grid;gap:4px}
.gatebox input{font:inherit;font-size:16px;padding:10px 12px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.gatebox input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.gatebox .err{color:var(--bad);font-size:14px;min-height:1.2em}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.names span.voted{border-color:var(--gold);color:var(--gold)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
body.host{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.brand .kicker{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.brand h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(22px,4vw,30px);line-height:1.25;text-wrap:balance}
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.chip.role{color:var(--gold);border-color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)} .dot.on{background:var(--hp)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:960px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr)}.record{position:sticky;top:16px}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}

/* scene */
.screen{position:relative;border:3px solid var(--frame);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line)}
#cv{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;pointer-events:none}
.hudbox{background:rgba(10,14,32,.78);border:2px solid var(--frame);border-radius:4px;padding:5px 8px;font-size:12px;line-height:1.3;color:var(--text)}
.hudbox .px{font-family:var(--pixel);font-size:9px;letter-spacing:.04em}
.hpbar{display:flex;align-items:center;gap:6px;margin-top:4px}
.hpbar .track{width:84px;height:8px;background:var(--hpbg);border:1px solid var(--frame)}
.hpbar .fill{height:100%;background:var(--hp);transition:width .6s steps(8)}
.hpbar .fill.low{background:var(--bad)}
.hpbar .fill.money{background:var(--gold)}
.hpbar .fill.money.low{background:var(--bad)}
.clock{text-align:right}
.clock .px{font-size:12px;color:var(--gold)}
@media (max-width:480px){.hudbox{font-size:11px;padding:4px 6px}.hpbar .track{width:60px}}

/* dialogue window */
.dlg{position:relative;background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--frame);border-radius:6px;padding:16px 18px 18px;box-shadow:inset 0 0 0 2px #0b1230;min-height:118px;cursor:pointer}
.dlg .ln{margin:0 0 6px;font-size:17px;line-height:1.75;min-height:1.75em}
.dlg .ln:last-child{margin-bottom:0}
.dlg .who{display:inline-block;font-weight:700;color:var(--gold);margin-right:8px}
.dlg .who.n{color:var(--muted);font-weight:500}
.dlg .ln.q{font-family:var(--serif);font-weight:700;font-size:19px}
.dlg .caret{position:absolute;right:10px;bottom:6px;color:var(--gold);font-size:13px;font-weight:700;padding:2px 6px;border:1px solid var(--gold);border-radius:4px;background:rgba(10,14,32,.6);animation:blink 1.2s steps(2) infinite}
.dlg.adv{cursor:pointer}
.dlg.adv:hover .caret{animation:none;background:var(--gold);color:#1b1608}
@keyframes blink{50%{opacity:0}}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:700}

/* menu */
.menu{display:grid;gap:8px}
.opt{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-size:16px;cursor:pointer;overflow:hidden}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt .L{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--frame);border-radius:4px;font-family:var(--pixel);font-size:11px;color:var(--frame)}
.opt .T{position:relative;z-index:1;min-width:0}
.opt .bar{position:absolute;inset:0 auto 0 0;background:#2A3152;z-index:0;transition:width .6s ease}
.opt .n{display:block;margin-top:3px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.mine,.opt.win{border-color:var(--gold)}
.opt.mine .L,.opt.win .L{background:var(--gold);border-color:var(--gold);color:#1b1608}
.opt.lose{opacity:.5}
.opt.tie{border-style:dashed;border-color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--gold);color:#1b1608;margin-left:6px;vertical-align:2px}

.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--serif);font-size:16px;color:var(--text)}
.sub{color:var(--muted);font-size:14px;margin:0}
.steps,.facts{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:15px}
details summary{cursor:pointer;color:var(--gold);font-size:14px}
details[open] summary{margin-bottom:8px}
.hands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.hand b{font-family:var(--pixel);font-size:11px;color:var(--text)}
.hand .row{display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.mini{font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wait{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.pulse{width:10px;height:10px;background:var(--gold);animation:blink 1s steps(2) infinite}

/* epilogue */
.events{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--panel);border:2px solid var(--line);border-left-width:6px;border-radius:6px;padding:12px 14px;animation:pop .5s ease both}
.ev.bad{border-left-color:var(--bad)} .ev.warn{border-left-color:var(--warn)} .ev.good{border-left-color:var(--good)}
.ev .ic{font-family:var(--pixel);font-size:14px;width:30px;height:30px;display:grid;place-items:center;border:2px solid currentColor;border-radius:4px}
.ev.bad .ic{color:var(--bad)} .ev.warn .ic{color:var(--warn)} .ev.good .ic{color:var(--good)}
.ev h4{margin:0 0 2px;font-size:16px}
.ev p{margin:0;font-size:15px;color:var(--text)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* grade */
.seal{display:grid;place-items:center;border:5px solid var(--seal);color:var(--seal);border-radius:8px;font-family:var(--serif);font-weight:900;transform:rotate(-7deg);line-height:1}
.seal.big{width:140px;height:140px;font-size:90px}
.seal.small{width:64px;height:64px;font-size:36px;border-width:4px}
.stamp{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:rotate(-7deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.gradebox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:520px){.gradebox{grid-template-columns:minmax(0,1fr);justify-items:start}}
.q{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3vw,24px);line-height:1.45;margin:0;text-wrap:balance}
.score{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.score b{font-size:22px;color:var(--text)}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.scale div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--muted)}
.scale div b{font-family:var(--serif);font-size:18px;color:var(--text);margin-right:4px}
.scale div.on{border-color:var(--seal);color:var(--seal)} .scale div.on b{color:var(--seal)}
.capnote{color:var(--bad);font-size:14px;margin:0}
.refs p{margin:0 0 6px;font-size:14px;color:var(--muted);padding-left:2em;text-indent:-2em}
.refs i{color:var(--text)}
.cd{float:right;font-family:var(--pixel);font-size:11px;color:var(--gold);padding:2px 6px;border:1px solid var(--gold);border-radius:4px}
.cd:empty{display:none}
.cd.low{color:var(--bad);border-color:var(--bad);animation:blink 1s steps(2) infinite}
.opt .n{display:inline;margin:0 0 0 8px;white-space:nowrap}
@media (max-width:640px){.hostbar .in{flex-wrap:nowrap;gap:6px}.hostbar .left{gap:6px;flex-wrap:nowrap}.hostbar .ghost{padding:6px 10px;font-size:13px}.tg.secs{display:none}.hostbar .hint{display:none}}
#hb-secs{font:inherit;font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.opt{padding:10px 12px;font-size:15px;line-height:1.5}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--gold);cursor:pointer}
.tool:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (min-width:960px){.tool.m-only{display:none}}
.soap{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.soap b{font-family:var(--pixel);font-size:10px;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--line);border-radius:4px;color:var(--muted)}
.soap b.done{border-color:var(--good);color:var(--good)}
.soap b.now{border-color:var(--gold);background:var(--gold);color:#1b1608}
.soap span{margin-left:6px}
.sp{font-style:normal;font-family:var(--pixel);font-size:8px;margin-left:4px;padding:1px 3px;border:1px solid var(--ink);border-radius:3px;color:var(--ink);vertical-align:1px}
.hint{color:var(--muted);font-size:13px}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(8,10,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:2px solid var(--frame);border-bottom:0;border-radius:12px 12px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h b{font-family:var(--serif);font-size:17px}
@media (min-width:960px){.sheet-wrap{align-items:center}.sheet{border-bottom:2px solid var(--frame);border-radius:10px}}
@media (max-width:959px){#record{display:none}}
.screen{width:min(100%,calc(30vh * 16 / 9));margin:0 auto}
@media (min-width:641px){.wrap{padding-block:12px 24px}header.top{margin-bottom:10px}.brand h1{font-size:22px}.stage{gap:10px}.dlg{padding:12px 16px 14px}.dlg .ln{font-size:16px;line-height:1.65;margin-bottom:2px}.dlg .ln.q{font-size:17px}.menu{gap:6px}.opt{padding:8px 12px}.opt .L{width:26px;height:26px}}
@media (min-width:960px){.record{max-height:calc(100vh - 110px)!important}.dlg{min-height:0}}
@media (max-width:640px){.screen{width:100%}.hud{padding:5px 6px}.hudbox{font-size:10px;padding:3px 5px;border-width:1px}.hudbox .px{font-size:7px}.hpbar{margin-top:2px;gap:4px}.hpbar .track{width:44px;height:6px}.clock .px{font-size:9px}}
@media (max-width:640px){
  .wrap{padding-block:8px 16px}
  header.top{margin-bottom:8px;gap:6px} .brand .kicker{display:none} .brand h1{font-size:17px}
  .stage{gap:8px}
  .dlg{padding:9px 12px 12px;min-height:0;border-width:2px}
  .dlg .ln{font-size:14.5px;line-height:1.6;margin-bottom:2px}
  .dlg .ln.q{font-size:15.5px}
  .menu{gap:6px}
  .opt{padding:7px 10px;font-size:14px;gap:8px;grid-template-columns:24px minmax(0,1fr);line-height:1.45;border-width:1.5px}
  .opt .L{width:24px;height:24px;font-size:9px}
  .opt .n{font-size:12px;margin-top:1px}
  .eyebrow{font-size:12px}
  .box{padding:10px 12px}
  .hostbar{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .btn{font-size:15px;padding:8px 16px}
  body.host{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
.form{border:1.5px solid var(--ink);margin-top:10px;font-size:14px}
.fh{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-bottom:1.5px solid var(--ink);font-size:14px;flex-wrap:wrap}
.fh span{font-family:var(--sans);font-size:12px;color:var(--pmuted)}
.fmeta{display:flex;flex-wrap:wrap;gap:4px 16px;padding:4px 8px;border-bottom:1px solid var(--prule);font-family:var(--sans);font-size:12px}
.fsec{font-family:var(--sans);font-weight:700;font-size:12px;padding:4px 8px;background:var(--psoft);border-bottom:1px solid var(--prule)}
.fr{display:grid;grid-template-columns:5.2em minmax(0,1fr);border-bottom:1px solid var(--prule)}
.fr:last-child{border-bottom:0}
.fk{padding:6px 8px;font-family:var(--sans);font-size:12px;color:var(--pmuted);border-right:1px solid var(--prule)}
.fv{padding:6px 8px;min-width:0;overflow-wrap:anywhere;display:grid;gap:4px;line-height:1.6}
.sub-ent.on{background:var(--psoft);border-radius:3px}
.sub-ent .lab{font-family:var(--sans);font-size:11px;color:var(--pmuted);margin-right:6px}
.ent.now{font-family:var(--sans);font-size:12px;color:var(--pmuted)}
.ent.fresh{animation:ink 1s ease}
.blank{display:inline-block;min-width:4em;color:var(--pmuted);font-family:var(--sans);font-size:12px}
.cbs{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--sans);font-size:12px}
.cbk{color:var(--pmuted)}
.cb{white-space:nowrap;color:var(--pmuted)} .cb.on{color:var(--ink);font-weight:700}
.fsign{display:grid;gap:2px;padding:6px 8px;border-top:1.5px solid var(--ink);font-family:var(--sans);font-size:12px}
@media (min-width:960px){.record{max-height:calc(100vh - 32px);overflow-y:auto}}
.fullnote .note{margin:0 0 8px;font-family:var(--serif);font-size:15.5px;line-height:1.85;background:var(--paper);color:var(--ink);padding:12px 14px;border-radius:4px}
.prof-in{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.ava{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--frame);border-radius:4px}
.prof dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px}
.prof dt{color:var(--gold);font-size:13px;white-space:nowrap;padding-top:2px}
.prof dd{margin:0;min-width:0}
@media (max-width:420px){.prof-in{grid-template-columns:minmax(0,1fr)}}
.gameover{border:3px solid var(--bad);border-radius:6px;padding:16px 18px;background:#2A1620;display:grid;gap:8px;animation:pop .5s ease both}
.gameover .go-t{font-family:var(--pixel);font-size:clamp(18px,4vw,26px);color:var(--bad);letter-spacing:.06em}
.gameover .go-s{font-family:var(--serif);font-weight:900;font-size:18px}
.gameover p{margin:0;font-size:15px}

/* compare */
.cmp{display:grid;gap:10px}
.ci{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.ci h4{margin:0;font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:640px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.two>div{border-radius:6px;padding:8px 10px;font-family:var(--serif);font-size:15px;min-width:0}
.two small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:2px}
.ours{background:#262A3D} .best{border:2px solid var(--gold)}
.why{margin:0;font-size:14px;color:var(--muted)} .why cite{font-style:normal;color:var(--gold)}
.mark{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:700;padding:0 7px;border-radius:999px;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.mark.g{color:var(--good)} .mark.w{color:var(--warn)} .mark.b{color:var(--bad)}

/* paper record */
.record{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 16px 12px;font-family:var(--serif);min-width:0;box-shadow:0 14px 34px -16px rgba(0,0,0,.7)}
.record .mark.g{color:#2C7A4B} .record .mark.w{color:#9A6210} .record .mark.b{color:#B0372B}
.rec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;flex-wrap:wrap}
.rec-head h2{margin:0;font-size:19px;font-weight:900;letter-spacing:.06em}
.rec-head span{font-family:var(--sans);font-size:12px;color:var(--pmuted)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--ink);font-size:13px}
.meta div{padding:5px 6px;border-right:1px solid var(--prule);min-width:0}
.meta div:last-child{border-right:0}
.meta small{display:block;color:var(--pmuted);font-family:var(--sans);font-size:11px}
.sec{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--pmuted);letter-spacing:.08em;padding:10px 0 2px;border-bottom:1px solid var(--ink)}
.r{display:grid;grid-template-columns:5.4em minmax(0,1fr);border-bottom:1px solid var(--prule);min-height:42px}
.r .k{padding:7px 8px 7px 0;font-size:12px;color:var(--pmuted);font-family:var(--sans);border-right:1px solid var(--prule)}

.btn{font:inherit;font-weight:700;font-size:16px;padding:10px 22px;border-radius:6px;border:2px solid var(--frame);background:var(--gold);color:#1b1608;cursor:pointer}

.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.tg{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

  let gi=GRADES.findIndex(g=>sc>=g.min);

  const unrec=S.picks[9]!=null&&ROUNDS[9].o[S.picks[9]].p===1;
  let capped=null;
  if(fatal&&gi<2){gi=2;capped="風險處置出現重大失誤（不寫、沒評估就下結論，或沒有通報），等級最高只到ㄇ。"}

}

  else if(s.type==="vote"&&S.sub==="tie")right=`<span class="hint">平手：請點一個選項</span>`;
  else if(s.type==="ideal")right=`<span class="hint">活動結束</span>`;
  else right=`<span class="hint">${s.type==="lobby"?"點對話框的 ▼ 開始":autoOn()?"自動進行中，也可以點 ▼ 跳下一步":isOver()?"點對話框的 ▼ 回到這一題重選":"點對話框的 ▼ 繼續"}</span>`;
  hb.innerHTML=`<div class="in"><div class="left">${left}</div>${right}</div>`;
}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-opt]");
  if(o&&!o.disabled){const i=+o.dataset.opt;if(S.sub==="vote")vote(i);else if(S.sub==="tie"&&isHost)hostChoose(i);return}
  const a=e.target.closest("[data-adj]");if(a){const [i,d]=a.dataset.adj.split(":").map(Number);adjust(i,d);return}
  if(e.target.closest("#hb-main"))hostPrimary();else if(e.target.closest("#hb-restart"))restart();else if(e.target.closest("#hb-back"))hostBack();
});
document.addEventListener("change",e=>{
  if(e.target.id==="hb-auto"){auto=e.target.checked;if(auto&&cur().type==="vote"&&S.sub==="vote"&&!S.dl)commit({...S,dl:newDl()});else if(!auto&&S.dl)commit({...S,dl:0});else render()}
  if(e.target.id==="hb-secs"){voteSecs=+e.target.value;try{localStorage.setItem("rg-secs",voteSecs)}catch(_){}if(autoOn()&&S.sub==="vote")commit({...S,dl:newDl()})}
});

/* ================= boot (Firebase) ================= */
let myName=load("rg-name")||"";
function goLocal(why){if(mode==="local")return;mode="local";isHost=true;localWhy=why||"";S=normalize(load("rg2-local"));dlgKey=null;gate(null);render()}
function gate(kind,err){
  const g=$("#gate");
  if(!kind){g.hidden=true;g.innerHTML="";return}
  g.hidden=false;
  if(kind==="join")g.innerHTML=`<form class="gatebox" id="gf"><h2>晴光社區心理諮商所</h2><p>今晚你是這裡的心理師。輸入暱稱加入，跟著主持人一起投票。</p>
    <label for="nick">暱稱<input id="nick" maxlength="12" autocomplete="nickname" value="${esc(myName)}" required></label><div class="err">${esc(err||"")}</div><button class="btn" type="submit">加入遊戲</button></form>`;
  else g.innerHTML=`<form class="gatebox" id="gf"><h2>主持人登入</h2><p>用你在 Firebase 建立的主持人帳號登入。</p>
    <label for="em">Email<input id="em" type="email" autocomplete="username" required></label>
    <label for="pw">密碼<input id="pw" type="password" autocomplete="current-password" required></label><div class="err">${esc(err||"")}</div>
    <button class="btn" type="submit">登入</button><button class="ghost" type="button" id="gl">先用單機模式</button></form>`;
  const f=$("#gf");
  f.addEventListener("submit",async e=>{e.preventDefault();
    if(kind==="join"){const n=$("#nick").value.trim().slice(0,12);if(!n){gate("join","請輸入暱稱");return}myName=n;store("rg-name",n);await join();}
    else{try{await firebase.auth().signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value)}catch(err){gate("host","登入失敗，請確認 email 和密碼。")}}
  });
  const gl=document.getElementById("gl");if(gl)gl.addEventListener("click",()=>goLocal(""));
}
async function join(){
  try{const ref=rdb.ref(`rooms/${ROOM}/players/${uid}`);await ref.set({name:myName,t:firebase.database.ServerValue.TIMESTAMP});ref.onDisconnect().remove();joined=true;gate(null);render()}
  catch(e){gate("join","加入失敗，請重新整理再試一次。")}
}
function subscribe(){
  if(subscribed)return;subscribed=true;
  stateRef=rdb.ref(`rooms/${ROOM}/state`);
  stateRef.on("value",snap=>{
    const next=snap.exists()?normalize(snap.val()):S;
    if(next.epoch!==S.epoch)manual={};
    if(STEPS[next.step].type==="vote"&&next.sub==="result"&&!(S.step===next.step&&S.sub==="result"))lastFresh=STEPS[next.step].r;
    S=next;render();
  },()=>goLocal("讀不到資料（請檢查 Firebase 規則）。"));
  rdb.ref(`rooms/${ROOM}/players`).on("value",snap=>{players=snap.val()||{};renderStatus();if(cur().type==="lobby"||cur().type==="vote")renderPanel()});
  rdb.ref(`rooms/${ROOM}/votes`).on("value",snap=>{votesNode=snap.val()||{};if(cur().type==="vote"&&S.sub==="vote")renderPanel()});
  rdb.ref(".info/connected").on("value",snap=>{connected=!!snap.val();renderStatus();if(connected&&joined&&!isHost){const ref=rdb.ref(`rooms/${ROOM}/players/${uid}`);ref.set({name:myName,t:firebase.database.ServerValue.TIMESTAMP});ref.onDisconnect().remove()}});
}
render();
if(!FIREBASE_CONFIG.apiKey||typeof firebase==="undefined"){goLocal("還沒有設定 Firebase。")}
else{
  firebase.initializeApp(FIREBASE_CONFIG);rdb=firebase.database();
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){if(WANT_HOST)gate("host");else firebase.auth().signInAnonymously().catch(e=>goLocal("匿名登入失敗（"+((e&&e.code)||"未知錯誤")+"）。"));return}
    uid=user.uid;
    if(WANT_HOST&&user.isAnonymous){gate("host");return}
    isHost=WANT_HOST&&!user.isAnonymous;mode="online";subscribe();
    if(isHost){gate(null);render()}
    else if(myName)join();else{render();gate("join")}
  });
}
</script>

</body>
</html>
